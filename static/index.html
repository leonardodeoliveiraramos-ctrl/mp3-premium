<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MP3 PREMIUM</title>
  
  <!-- PWA & Mobile Settings -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1f6aa5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MP3 PREMIUM">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/favicon-64.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/style.css">
</head>
<body class="theme-system">

  <div class="mobile-app-shell">
    
    <!-- Top Bar com status de conexão e QR code para parear celular -->
    <header class="app-header">
      <div class="brand">
        <img src="/icons/favicon-64.png" alt="MP3 PREMIUM Ícone" class="app-logo">
        <h1 class="app-title">MP3 PREMIUM</h1>
      </div>
      <button id="btn-show-qr" class="icon-btn" title="Ver QR Code do Celular" aria-label="QR Code">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>
    </header>

    <!-- Container Principal (mesma distribuição do app desktop) -->
    <main class="main-content">
      
      <!-- Seletor de Tema -->
      <div class="theme-row">
        <span class="theme-label">Tema:</span>
        <div class="custom-select-wrap">
          <select id="select-theme" class="custom-select">
            <option value="System">System</option>
            <option value="Dark">Dark</option>
            <option value="Light">Light</option>
          </select>
        </div>
      </div>

      <!-- Campo de URL com botão Colar -->
      <div class="input-card">
        <div class="input-wrapper">
          <input 
            type="text" 
            id="input-url" 
            class="entry-url" 
            placeholder="Cole o link aqui..." 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="off" 
            spellcheck="false"
          >
          <button id="btn-paste" class="btn-paste" title="Colar link copiado">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
            </svg>
            <span>Colar</span>
          </button>
        </div>
      </div>

      <!-- Card de Prévia do Vídeo (Aparece ao colar o link) -->
      <div id="preview-card" class="preview-card hidden">
        <img id="preview-thumb" src="" alt="Thumbnail" class="preview-thumb">
        <div class="preview-info">
          <h4 id="preview-title" class="preview-title">Carregando informações...</h4>
          <p id="preview-author" class="preview-author">-</p>
          <span id="preview-badge" class="preview-badge">MP3 / MP4</span>
        </div>
      </div>

      <!-- Seleção de Modo (Vídeo MP4 ou Áudio MP3) -->
      <div class="mode-selection">
        <label class="radio-pill">
          <input type="radio" name="download_mode" value="video" checked id="radio-video">
          <span class="pill-content">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
            Vídeo (MP4)
          </span>
        </label>

        <label class="radio-pill">
          <input type="radio" name="download_mode" value="audio" id="radio-audio">
          <span class="pill-content">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 18V5l12-2v13"></path>
              <circle cx="6" cy="18" r="3"></circle>
              <circle cx="18" cy="16" r="3"></circle>
            </svg>
            Áudio (MP3)
          </span>
        </label>
      </div>

      <!-- Opção de Playlist -->
      <div class="checkbox-row">
        <label class="custom-checkbox">
          <input type="checkbox" id="check-playlist">
          <span class="checkmark"></span>
          <span class="check-text">Baixar Playlist Inteira?</span>
        </label>
      </div>

      <!-- Botão de Download Principal -->
      <div class="action-section">
        <button id="btn-download" class="btn-download">
          <span class="btn-text">BAIXAR AGORA</span>
          <span class="spinner hidden"></span>
        </button>
      </div>

      <!-- Seção de Progresso -->
      <div class="progress-section">
        <div class="progress-bar-bg">
          <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
        <div class="status-labels">
          <span id="label-status" class="label-status">Pronto para iniciar</span>
          <span id="label-percentage" class="label-percentage">0%</span>
        </div>
      </div>

      <!-- Card de Conclusão / Salvar no Celular -->
      <div id="result-card" class="result-card hidden">
        <div class="result-header">
          <div class="success-icon">✓</div>
          <div>
            <h3 class="result-title">Download Pronto!</h3>
            <p id="result-filename" class="result-filename">musica.mp3</p>
          </div>
        </div>
        
        <!-- Player de Pré-escuta / Visualização rápida -->
        <div id="media-player-container" class="media-player-container hidden">
          <audio id="audio-preview" controls class="audio-player"></audio>
        </div>

        <div class="result-actions">
          <a id="btn-save-device" href="#" class="btn-save" download>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Salvar no Celular
          </a>
        </div>
      </div>

      <!-- Botão de Instalação PWA (Aparece em smartphones) -->
      <div id="pwa-install-banner" class="pwa-banner hidden">
        <div class="pwa-text">
          <strong>Instalar no Celular</strong>
          <span>Tenha o app na tela inicial</span>
        </div>
        <button id="btn-install-pwa" class="btn-install">Instalar</button>
      </div>

    </main>

    <!-- Modal do QR Code (para abrir no celular) -->
    <div id="modal-qr" class="modal-overlay hidden">
      <div class="modal-card">
        <button id="btn-close-qr" class="modal-close">&times;</button>
        <h3>Abra no seu Celular</h3>
        <p class="modal-subtitle">Conecte seu celular no mesmo Wi-Fi e escaneie o código abaixo com a câmera:</p>
        <div class="qr-wrapper">
          <img id="qr-image" src="" alt="QR Code para Celular">
        </div>
        <p class="mobile-url-text" id="mobile-url-link">http://...</p>
        <button id="btn-copy-url" class="btn-copy-url">Copiar Link do Celular</button>
      </div>
    </div>

    <!-- Toast de Notificação -->
    <div id="toast" class="toast hidden"></div>

  </div>

  <script src="/app.js"></script>
</body>
</html>
